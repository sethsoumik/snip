name: keep-alive

on:
  schedule:
    # Every 10 minutes (UTC) — safely under Render free tier's ~15 min sleep.
    - cron: '*/13 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render instance (cold start can exceed 90s)
        run: curl -sS --max-time 240 https://snip.soumikseth.in/actuator/health || true

      - name: Verify health
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 15 https://snip.soumikseth.in/actuator/health

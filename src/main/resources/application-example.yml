# Example configuration. Copy this file to application.yml and fill in real
# values, or set the matching environment variables. Never commit real secrets —
# application.yml is gitignored.
spring:
  application:
    name: snip

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/snip}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Dashboard login (user "admin"). Set ADMIN_PASSWORD in production.
  admin-password: ${ADMIN_PASSWORD:admin}
  short-code:
    # Secret seed that shuffles the code alphabet. Randomize it in production.
    seed: ${SHORT_CODE_SEED:42}

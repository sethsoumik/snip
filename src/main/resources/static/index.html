<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="snip — the shortest possible links. Paste a long URL, get a tiny one. Keep it forever." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>snip — shortest links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <span class="prompt">$ whoami</span>
      <h1 class="logo">snip<span class="cursor">_</span></h1>
      <p class="tag">shorten it. keep it forever.</p>
    </header>

    <form id="snip-form" class="terminal" autocomplete="off" novalidate>
      <span class="ps1">~/snip $</span>
      <input
        id="url"
        class="input"
        type="text"
        placeholder="https://your-very-long-link..."
        spellcheck="false"
      />
      <button id="snip-btn" class="run" type="submit">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
        snip
      </button>
    </form>

    <section id="result" class="result" hidden>
      <span class="label">// your link</span>
      <div class="result-row">
        <a id="short-link" class="short" href="#" target="_blank" rel="noopener"></a>
        <button id="copy" class="copy" type="button">copy</button>
      </div>
    </section>

    <p id="error" class="error" hidden></p>

    <footer class="foot">snip → snip.soumikseth.in</footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>

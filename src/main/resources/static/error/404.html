<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>404 — snip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .err-code {
      margin: 8px 0 4px;
      font-family: var(--display);
      font-size: clamp(5rem, 24vw, 10rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .err-msg {
      margin: 0 0 32px;
      color: var(--mist);
      font-size: 15px;
    }
    .err-msg span {
      color: var(--accent);
    }
    .home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--bone);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .home:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <span class="prompt">$ whoami</span>
      <h1 class="logo">snip<span class="cursor">_</span></h1>
    </header>

    <p class="err-code">404</p>
    <p class="err-msg">command not found: <span id="path">/</span></p>
    <a class="home" href="/">cd ~/snip</a>

    <footer class="foot">snip → snip.soumikseth.in</footer>
  </main>

  <script>
    document.getElementById('path').textContent = location.pathname || '/';
  </script>
</body>
</html>

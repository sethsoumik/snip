<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>snip — admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121214;
      --line: #26262a;
      --bone: #ece7dc;
      --mist: #8a8a93;
      --accent: #4ade80;
      --accent-dim: rgba(74, 222, 128, 0.12);
      --amber: #fbbf24;
      --blue: #60a5fa;
      --red: #f87171;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --display: "Space Grotesk", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 24px;
      background: var(--bg);
      color: var(--bone);
      font-family: var(--mono);
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .wrap { width: 100%; max-width: 880px; margin: 0 auto; }

    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .brand { margin-bottom: 32px; }
    .prompt { color: var(--accent); font-size: 13px; }
    .logo {
      margin: 8px 0 6px;
      font-family: var(--display);
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .cursor { color: var(--accent); animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .tag { margin: 0; color: var(--mist); font-size: 14px; }

    .logout {
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--mist);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .logout:hover { color: var(--bone); border-color: var(--red); }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: var(--mist);
      font-size: 12px;
    }
    .live .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
      70% { box-shadow: 0 0 0 7px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    .status-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .status .name { color: var(--mist); font-size: 13px; }
    .status .value { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 14px; }
    .status .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status .pill.up { background: var(--accent-dim); color: var(--accent); }
    .status .pill.down { background: rgba(248, 113, 113, 0.12); color: var(--red); }
    .status .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      .status-row { grid-template-columns: 1fr; }
    }

    .card { padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    .card .k {
      display: block;
      margin-bottom: 8px;
      color: var(--mist);
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .card .v {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .card .v.rate { color: var(--accent); }

    .split { margin-top: 20px; }
    .label { margin: 0 0 10px; color: var(--accent); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
    .bar { height: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.4s ease; }
    .hint { margin: 8px 0 0; color: var(--mist); font-size: 12px; }

    .log { margin-top: 28px; }
    .log .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .log .count { color: var(--mist); font-size: 12px; }
    .log-box {
      padding: 14px 16px;
      max-height: 340px;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .log-row { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; font-size: 13px; line-height: 1.6; }
    .log-row .ts { flex: 0 0 64px; color: #5b5b64; }
    .log-row .lv { flex: 0 0 56px; color: var(--mist); font-weight: 700; }
    .log-row .lv.CACHE { color: var(--accent); }
    .log-row .lv.DB { color: var(--amber); }
    .log-row .lv.CREATE { color: var(--blue); }
    .log-row .lv.N404 { color: var(--red); }
    .log-row .msg { flex: 1; color: var(--bone); word-break: break-all; }
    .muted { color: #4a4a52; }

    .foot { margin-top: 40px; color: #3a3a41; font-size: 12px; }
    .foot a { color: var(--mist); text-decoration: none; }
    .foot a:hover { color: var(--bone); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <header class="brand">
        <span class="prompt">$ whoami</span>
        <h1 class="logo">snip<span class="cursor">_</span></h1>
        <p class="tag">admin · /metrics</p>
        <span class="live"><span class="dot"></span> live</span>
      </header>
      <button id="logout" class="logout" type="button">logout</button>
    </div>

    <section class="status-row">
      <div class="status">
        <span class="name">postgres</span>
        <span class="value"><span id="dbStatus" class="pill up"><span class="dot"></span>—</span></span>
      </div>
      <div class="status">
        <span class="name">redis</span>
        <span class="value"><span id="redisStatus" class="pill up"><span class="dot"></span>—</span></span>
      </div>
    </section>

    <section class="grid">
      <div class="card"><span class="k">total links</span><span class="v" id="totalLinks">—</span></div>
      <div class="card"><span class="k">total clicks</span><span class="v" id="totalClicks">—</span></div>
      <div class="card"><span class="k">cache hits</span><span class="v" id="cacheHits">—</span></div>
      <div class="card"><span class="k">cache misses</span><span class="v" id="cacheMisses">—</span></div>
      <div class="card"><span class="k">hit rate</span><span class="v rate" id="hitRate">—</span></div>
      <div class="card"><span class="k">created</span><span class="v" id="creates">—</span></div>
      <div class="card"><span class="k">404s</span><span class="v" id="notFound">—</span></div>
      <div class="card"><span class="k">uptime</span><span class="v" id="uptime">—</span></div>
    </section>

    <section class="split">
      <p class="label">cache vs db</p>
      <div class="bar"><span id="cacheBar"></span></div>
      <p class="hint" id="cacheHint">—</p>
    </section>

    <section class="log">
      <div class="head">
        <p class="label">live logs</p>
        <span class="count" id="logCount"></span>
      </div>
      <div class="log-box" id="log"><span class="muted">waiting for events…</span></div>
    </section>

    <footer class="foot">snip → <a href="/">snip.soumikseth.in</a></footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function fmt(n) { return Number(n).toLocaleString('en-US'); }

    function fmtUptime(s) {
      s = Number(s) || 0;
      const d = Math.floor(s / 86400);
      const h = Math.floor((s % 86400) / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (d > 0) return d + 'd ' + h + 'h';
      if (h > 0) return h + 'h ' + m + 'm';
      if (m > 0) return m + 'm ' + sec + 's';
      return sec + 's';
    }

    function setPill(id, status) {
      const el = $(id);
      const up = status === 'up';
      el.className = 'pill ' + (up ? 'up' : 'down');
      el.innerHTML = '<span class="dot"></span>' + (up ? 'up' : 'down');
    }

    function renderMetrics(m) {
      setPill('dbStatus', m.dbStatus);
      setPill('redisStatus', m.redisStatus);
      $('totalLinks').textContent = fmt(m.totalLinks);
      $('totalClicks').textContent = fmt(m.totalClicks);
      $('cacheHits').textContent = fmt(m.cacheHits);
      $('cacheMisses').textContent = fmt(m.cacheMisses);
      $('hitRate').textContent = (m.cacheHitRate * 100).toFixed(1) + '%';
      $('creates').textContent = fmt(m.creates);
      $('notFound').textContent = fmt(m.notFound);
      $('uptime').textContent = fmtUptime(m.uptimeSeconds);

      const pct = (m.cacheHitRate * 100).toFixed(1);
      $('cacheBar').style.width = pct + '%';
      $('cacheHint').textContent = m.cacheHits + ' from cache · ' + m.cacheMisses + ' from db';
    }

    function renderLogs(entries) {
      if (!entries || !entries.length) {
        $('log').innerHTML = '<span class="muted">no events yet</span>';
        $('logCount').textContent = '';
        return;
      }
      $('logCount').textContent = entries.length + ' events';
      const html = entries.slice().reverse().map((e) => {
        const d = new Date(e.timestamp);
        const ts = d.toLocaleTimeString('en-US', { hour12: false });
        const lv = e.level === '404' ? 'N404' : e.level;
        return '<div class="log-row">' +
          '<span class="ts">' + ts + '</span>' +
          '<span class="lv ' + lv + '">' + e.level + '</span>' +
          '<span class="msg">' + escapeHtml(e.message) + '</span>' +
        '</div>';
      }).join('');
      $('log').innerHTML = html;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function load() {
      try {
        const [m, l] = await Promise.all([
          fetch('/api/v1/admin/metrics').then((r) => (r.ok ? r.json() : null)),
          fetch('/api/v1/admin/logs').then((r) => (r.ok ? r.json() : null)),
        ]);
        if (m) renderMetrics(m);
        if (l) renderLogs(l);
      } catch (e) {
        /* transient — next poll will retry */
      }
    }

    $('logout').addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' }).catch(() => {});
      window.location.href = '/admin/login';
    });

    load();
    setInterval(load, 2500);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>snip — admin login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121214;
      --line: #26262a;
      --bone: #ece7dc;
      --mist: #8a8a93;
      --accent: #4ade80;
      --accent-dim: rgba(74, 222, 128, 0.12);
      --red: #f87171;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --display: "Space Grotesk", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--bone);
      font-family: var(--mono);
      background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .wrap { width: 100%; max-width: 420px; }

    .brand { margin-bottom: 32px; }
    .prompt { color: var(--accent); font-size: 13px; }
    .logo {
      margin: 8px 0 6px;
      font-family: var(--display);
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .cursor { color: var(--accent); animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .tag { margin: 0; color: var(--mist); font-size: 14px; }

    .terminal {
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 13px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--bone);
      font-family: var(--mono);
      font-size: 15px;
      outline: none;
    }
    .field input:focus { border-color: var(--accent); }

    .run {
      width: 100%;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: var(--bone);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .run:hover { transform: translateY(-1px); opacity: 0.92; }
    .run:disabled { opacity: 0.5; cursor: default; transform: none; }

    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      border: 1px solid rgba(248, 113, 113, 0.4);
      border-radius: 8px;
      color: var(--red);
      font-size: 13px;
    }

    .foot { margin-top: 32px; color: #3a3a41; font-size: 12px; }
    .foot a { color: var(--mist); text-decoration: none; }
    .foot a:hover { color: var(--bone); }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <span class="prompt">$ ssh admin@snip</span>
      <h1 class="logo">snip<span class="cursor">_</span></h1>
      <p class="tag">restricted area · authenticate</p>
    </header>

    <form id="login-form" class="terminal" autocomplete="off">
      <div class="field">
        <label for="username">username</label>
        <input id="username" name="username" type="text" placeholder="admin" required autofocus />
      </div>
      <div class="field">
        <label for="password">password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />
      </div>
      <button id="submit" class="run" type="submit">authenticate</button>
      <p id="error" class="error"></p>
    </form>

    <footer class="foot">snip → <a href="/">snip.soumikseth.in</a></footer>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const submit = document.getElementById('submit');
    const errorEl = document.getElementById('error');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.style.display = 'none';
      submit.disabled = true;

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (res.ok) {
          window.location.href = '/admin';
          return;
        }
        errorEl.textContent = 'invalid credentials';
        errorEl.style.display = 'block';
      } catch (e) {
        errorEl.textContent = 'something went wrong, try again';
        errorEl.style.display = 'block';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
